<style>
:root {
  --bg: #F6F7F9; --ink: #1D2330; --muted: #6B7280; --faint: #DCE1E8; --card: #FFFFFF; --accent: #2F6DB5; --hover: #EEF1F5;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* The talk is designed as a light, paper-like explainer in both viewer themes. */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #F6F7F9; --ink: #1D2330; --muted: #6B7280; --faint: #DCE1E8; --card: #FFFFFF; --accent: #2F6DB5; --hover: #EEF1F5; } }
:root[data-theme="dark"] { --bg: #F6F7F9; --ink: #1D2330; --muted: #6B7280; --faint: #DCE1E8; --card: #FFFFFF; --accent: #2F6DB5; --hover: #EEF1F5; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage { display: block; width: 100%; height: 100%; max-width: 100%; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; text-rendering: geometricPrecision; }
#stage text { font-family: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif; white-space: pre; }
#stage .sans { font-family: "Fira Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
#stage .outline, #stage .outline tspan { fill: none !important; stroke: currentColor; stroke-width: 1.1px; stroke-linejoin: round; }
#stage .clickable { cursor: pointer; }
.ui { font: 15px/1.4 "Fira Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
#bar { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 2px; align-items: center;
  padding: 5px 6px; background: rgba(255, 255, 255, .95); border: 1px solid var(--faint); border-radius: 12px; box-shadow: 0 6px 20px rgba(29, 35, 48, .08); opacity: 0; transition: opacity .25s; }
#bar.show, #bar:focus-within { opacity: 1; }
#bar button { background: none; border: 0; color: var(--ink); padding: 7px 11px; border-radius: 8px; cursor: pointer; font: inherit; display: inline-flex; align-items: center; }
#bar button:hover, #bar button:focus-visible { background: var(--hover); outline: none; }
#pos { color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }
#hint { position: absolute; left: 50%; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); color: var(--muted);
  background: rgba(255, 255, 255, .95); border: 1px solid var(--faint); border-radius: 10px; padding: 8px 14px; transition: opacity .6s; pointer-events: none;
  white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis; }
#hint.gone { opacity: 0; }
#hint kbd { font: 12px ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--faint); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--ink); background: var(--bg); }
#notes { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 92vw); background: var(--card); border-left: 1px solid var(--faint); box-shadow: -8px 0 24px rgba(29, 35, 48, .06);
  transform: translateX(104%); transition: transform .3s ease; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#notes.open { transform: none; }
#notes header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 6px; }
#nTitle { display: block; font: 500 21px/1.25 "Newsreader", Georgia, serif; color: var(--ink); }
#nBeat { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
#nClose { background: none; border: 1px solid var(--faint); color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; }
#nClose:hover, #nClose:focus-visible { color: var(--ink); outline: none; border-color: var(--muted); }
#nBody { padding: 8px 20px 16px; overflow-y: auto; flex: 1; font: 19px/1.6 "Newsreader", Georgia, serif; }
#nBody p { margin: 0; }
#nBody .seg { color: var(--muted); }
#nBody .seg.now { color: var(--ink); }
#nBody .click { display: inline-block; font: 11px/1 "Fira Sans", system-ui, sans-serif; color: var(--accent); border: 1px solid rgba(47, 109, 181, .45); border-radius: 4px; padding: 2px 4px; margin: 0 5px; vertical-align: 2px; }
#nIndex { border-top: 1px solid var(--faint); padding: 8px 12px 12px; max-height: 28%; overflow-y: auto; }
#nIndex button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--muted); padding: 4px 8px; border-radius: 6px; cursor: pointer; font: 14px/1.35 "Fira Sans", system-ui, sans-serif; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
#nIndex button:hover, #nIndex button:focus-visible { color: var(--ink); outline: none; }
#nIndex button.cur { color: var(--ink); background: var(--hover); }
#nKeys { color: var(--muted); font-size: 12px; padding: 0 20px 10px; }
#blank { position: absolute; inset: 0; background: #000; display: none; }
#blank.on { display: block; }
@media (prefers-reduced-motion: reduce) { #notes, #bar, #hint { transition: none; } }
</style>

}
function series(g, xs, ys, xv, yv, col, o = {}) {
  const pts = xs.map((x, i) => [xv(x), yv(ys[i])]);
  const path = g.append('path').attr('d', 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join('L')).attr('fill', 'none').attr('stroke', col)

  if (o.dash) path.attr('stroke-dasharray', o.dash).attr('data-dash', o.dash);
  const dots = o.noDots ? [] : pts.map(p => g.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', o.r || 6.5).attr('fill', col).attr('stroke', C.bg).attr('stroke-width', 2).style('opacity', 0));
  return { path, dots, pts };
}
function drawSeries(s, o = {}) {
  const dur = o.dur ?? 1200;
  create(s.path, { dur, delay: o.delay });
  if (s.dots.length) pop(s.dots, { delay: (o.delay || 0) + 100, stagger: dur * 0.85 / s.dots.length, dur: 350 });
}
function legendRow(g, x, y, text, col, o = {}) {
  const grp = g.append('g').style('opacity', 0);
  grp.append('line').attr('x1', x).attr('x2', x + 36).attr('y1', y - 7).attr('y2', y - 7).attr('stroke', col).attr('stroke-width', o.w || 4).attr('stroke-linecap', 'round');
  T(grp, text, { x: x + 48, y, size: o.size || 22, sans: true, show: true, color: o.color || C.ink });
  return grp;
}

function miniTL(g, x, y, o) {
  const grp = g.append('g').style('opacity', 0), W = 540, X = yr => x + (yr - o.a) / (o.b - o.a) * W;

  const ay = y + 104;
  grp.append('line').attr('x1', x).attr('x2', x + W).attr('y1', ay).attr('y2', ay).attr('stroke', C.ink).attr('stroke-width', 2);
  o.ticks.forEach(t => { grp.append('line').attr('x1', X(t)).attr('x2', X(t)).attr('y1', ay - 6).attr('y2', ay + 6).attr('stroke', C.ink).attr('stroke-width', 2);

  grp.append('rect').attr('x', X(o.term[0])).attr('y', y + 30).attr('width', Math.max(6, X(o.term[1]) - X(o.term[0]))).attr('height', 24).attr('rx', 5).attr('fill', C.time);

  grp.append('rect').attr('x', X(o.tech)).attr('y', y + 62).attr('width', x + W - X(o.tech)).attr('height', 24).attr('rx', 5).attr('fill', C.gold);
  T(grp, o.techL, { x: X(o.tech) - 10, y: y + 81, size: 19, sans: true, anchor: 'end', color: C.gold, show: true });

  T(grp, `model: <r>${o.model}</r>`, { x: vx, y: y + 84, size: 23, sans: true, show: true });
  return grp;
}

const svg = d3.select('#stage');
const DEFS = svg.append('defs').node();
svg.append('rect').attr('width', 1920).attr('height', 1080).attr('fill', C.bg);
const layer = svg.append('g');
const chrome = svg.append('g').style('pointer-events', 'none');
const pageNo = chrome.append('text').attr('x', 1872).attr('y', 1050).attr('text-anchor', 'end').attr('font-size', 20).attr('fill', C.muted).attr('fill-opacity', 0.75);
chrome.append('rect').attr('x', 0).attr('y', 1077).attr('width', 1920).attr('height', 3).attr('fill', C.faint);
const prog = chrome.append('rect').attr('x', 0).attr('y', 1077).attr('height', 3).attr('width', 0).attr('fill', C.think).attr('fill-opacity', 0.7);

const MAIN_N = SCENES.filter(s => !s.backup).length;
const KEY = 'chronollm-talk-pos';
let cur = { si: -1, bi: -1, g: null, ctx: null };
const label = i => (SCENES[i].backup ? 'A' + (i - MAIN_N + 1) : String(i + 1));

function buildScene(si) {
  const g = layer.append('g').attr('class', 'scene');
  let ctx;
  instant(() => { ctx = SCENES[si].build(g) || {}; });
  return { g, ctx };
}
function runBeat(ctx, f) { if (!MOTION) instant(() => f(ctx)); else f(ctx); }
function showState(si, bi) {
  finishAll();
  layer.selectAll('g.scene').remove();
  const { g, ctx } = buildScene(si);
  for (let b = 0; b <= bi; b++) instant(() => SCENES[si].beats[b](ctx));
  cur = { si, bi, g, ctx };
  afterNav();
}
function enterScene(si) {
  finishAll();
  const sc = SCENES[si], old = cur.g;
  let delay = 0;
  if (old) {
    if (sc.cont || !MOTION) old.remove();
    else { const n = old.node(); tw(320, p => { n.style.opacity = 1 - p; }, { end() { n.remove(); } }); delay = 250; }
  }
  const { g, ctx } = buildScene(si);
  cur = { si, bi: 0, g, ctx };
  A.base = delay;
  try { runBeat(ctx, sc.beats[0]); } finally { A.base = 0; }
  afterNav();
}
function next() {
  hideHint();
  if (A.list.length) { finishAll(); return; }
  const sc = SCENES[cur.si];
  if (cur.bi < sc.beats.length - 1) { cur.bi++; runBeat(cur.ctx, sc.beats[cur.bi]); afterNav(); }
  else if (cur.si < SCENES.length - 1) enterScene(cur.si + 1);
}
function prev() {
  hideHint();
  if (cur.bi > 0) showState(cur.si, cur.bi - 1);
  else if (cur.si > 0) showState(cur.si - 1, SCENES[cur.si - 1].beats.length - 1);
}
function jump(si) { hideHint(); enterScene(si); }

/* ============ chrome, notes, storage ============ */
const $ = id => document.getElementById(id);
function afterNav() {
  const sc = SCENES[cur.si];
  pageNo.text(label(cur.si));
  let tot = 0, done = 0;
  SCENES.forEach((s, i) => { if (s.backup) return; tot += s.beats.length; if (i < cur.si) done += s.beats.length; else if (i === cur.si) done += cur.bi + 1; });
  prog.attr('width', sc.backup ? 1920 : 1920 * done / tot);
  $('pos').textContent = sc.backup ? label(cur.si) : `${cur.si + 1} / ${MAIN_N}`;
  renderNotes();
  try { sessionStorage.setItem(KEY, JSON.stringify({ si: cur.si, bi: cur.bi })); } catch (e) { /* storage unavailable */ }
}
function renderNotes() {
  const sc = SCENES[cur.si];
  $('nTitle').textContent = `${label(cur.si)}. ${sc.title.replace(/^(Backup|Appendix): /, '')}`;
  $('nBeat').textContent = `step ${cur.bi + 1} of ${sc.beats.length}`;
  const body = $('nBody');
  body.textContent = '';
  const p = document.createElement('p');
  (sc.notes || '').split('[click]').forEach((seg, k) => {
    if (k > 0) { const b = document.createElement('span'); b.className = 'click'; b.textContent = 'click'; p.appendChild(b); }

    s.textContent = seg;
    p.appendChild(s);

  if (now && $('notes').classList.contains('open')) now.scrollIntoView({ block: 'nearest' });
  document.querySelectorAll('#nIndex button').forEach((b, i) => b.classList.toggle('cur', i === cur.si));
}
function buildIndex() {
  const idx = $('nIndex');
  SCENES.forEach((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = `${label(i)}   ${s.title.replace(/^(Backup|Appendix): /, '')}`;
    b.addEventListener('click', ev => { ev.stopPropagation(); jump(i); });

}
function toggleNotes(force) {
  const el = $('notes'), open = force ?? !el.classList.contains('open');
  el.classList.toggle('open', open);
  el.setAttribute('aria-hidden', String(!open));
  $('bNotes').setAttribute('aria-pressed', String(open));

}
let hintTimer = 0;
function showHint(text, ms) {
  const h = $('hint');
  if (text) h.textContent = text;
  h.classList.remove('gone');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => h.classList.add('gone'), ms || 6000);
}
function hideHint() { $('hint').classList.add('gone'); }
function toggleFull() {
  const d = document, el = d.documentElement;
  try {
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else {
      const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      if (r && r.catch) r.catch(() => showHint('Fullscreen is not available here', 2000));
    }
  } catch (e) { showHint('Fullscreen is not available here', 2000); }
}

/* ============ input ============ */
function bindInput() {
  const stage = $('stage');
  let suppress = false, tx0 = null, ty0 = null;
  stage.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('.clickable, a')) return;
    if (suppress) { suppress = false; return; }
    next();
  });
  stage.addEventListener('touchstart', e => { const t = e.changedTouches[0]; tx0 = t.clientX; ty0 = t.clientY; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (tx0 == null) return;
    const t = e.changedTouches[0], dx = t.clientX - tx0, dy = t.clientY - ty0;
    tx0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { suppress = true; setTimeout(() => { suppress = false; }, 600); if (dx < 0) next(); else prev(); }
  }, { passive: true });
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key, onButton = e.target && e.target.tagName === 'BUTTON';
    if ((k === ' ' || k === 'Enter') && onButton) return;
    if (['ArrowRight', 'PageDown', ' ', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)) { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); jump(0); }
    else if (k === 'End') { e.preventDefault(); hideHint(); showState(MAIN_N - 1, SCENES[MAIN_N - 1].beats.length - 1); }
    else if (k === 'n' || k === 'N') toggleNotes();
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 'm' || k === 'M') { MOTION = !MOTION; if (!MOTION) finishAll(); showHint(MOTION ? 'Animations on' : 'Animations off', 1500); }
    else if (k === 'b' || k === 'B' || k === '.') $('blank').classList.toggle('on');
    else if (k === 'Escape') { toggleNotes(false); $('blank').classList.remove('on'); }
  });
  $('bPrev').addEventListener('click', e => { e.stopPropagation(); prev(); });
  $('bNext').addEventListener('click', e => { e.stopPropagation(); next(); });
  $('bNotes').addEventListener('click', e => { e.stopPropagation(); toggleNotes(); });
  $('nClose').addEventListener('click', e => { e.stopPropagation(); toggleNotes(false); });
  $('bFull').addEventListener('click', e => { e.stopPropagation(); toggleFull(); });
  $('blank').addEventListener('click', () => $('blank').classList.remove('on'));
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('bFull').style.display = 'none';
  const bar = $('bar');
  let barTimer = 0, overBar = false;
  const wake = () => { bar.classList.add('show'); clearTimeout(barTimer); barTimer = setTimeout(() => { if (!overBar) bar.classList.remove('show'); }, 2500); };
  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake, { passive: true });
  bar.addEventListener('mouseenter', () => { overBar = true; bar.classList.add('show'); });
  bar.addEventListener('mouseleave', () => { overBar = false; wake(); });
}

/* ============ boot ============ */
async function init() {
  buildIndex();
  bindInput();
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) MOTION = false; } catch (e) { /* ignore */ }
  let timedOut = false;
  const faces = ['400 32px "Newsreader"', 'italic 400 32px "Newsreader"', '600 32px "Newsreader"', '400 32px "Fira Sans"', '500 32px "Fira Sans"', '600 32px "Fira Sans"', 'italic 400 32px "Fira Sans"'];
  const all = document.fonts ? Promise.all(faces.map(f => document.fonts.load(f).catch(() => null))) : Promise.resolve();
  await Promise.race([all, new Promise(r => setTimeout(() => { timedOut = true; r(); }, 3000))]);
  let pos = null;
  try { pos = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) { pos = null; }
  if (pos && SCENES[pos.si] && pos.bi >= 0 && pos.bi < SCENES[pos.si].beats.length && !(pos.si === 0 && pos.bi === 0)) showState(pos.si, pos.bi);
  else enterScene(0);
  if (timedOut) all.then(() => showState(cur.si, cur.bi));
  showHint();
  window.__goto = (si, bi) => showState(si, bi);
  window.__state = () => ({ si: cur.si, bi: cur.bi, busy: A.list.length, scenes: SCENES.map(s => ({ key: s.key, beats: s.beats.length, clicks: (s.notes || '').split('[click]').length })) });
  window.__next = next;
  window.__finish = finishAll;
  window.__motion = v => { MOTION = v; };
}
init();

</script>
