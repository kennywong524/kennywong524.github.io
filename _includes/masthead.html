<header class="masthead">
  <nav class="site-navigation" aria-label="Main navigation">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <ul class="site-links">
      {% for link in site.data.navigation.main %}
      <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
      {% endfor %}
      <li class="more-item">
        <details class="nav-more">
          <summary{% for link in site.data.navigation.secondary %}{% if page.url == link.url %} class="is-current"{% endif %}{% endfor %}>More <span aria-hidden="true">⌄</span></summary>
          <ul class="more-links">
            {% for link in site.data.navigation.secondary %}
            <li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
            {% endfor %}
          </ul>
        </details>
      </li>
    </ul>
  </nav>
</header>
